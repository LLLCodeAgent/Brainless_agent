<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainless Agent Command Center</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header><div><p class="eyebrow">AUTONOMOUS OPERATIONS</p><h1>Brainless Agent <span>Command Center</span></h1></div><div id="runtimeBadge" class="badge">CONNECTING</div></header>
<div class="shell"><nav aria-label="Command center"><button data-view="overview" class="active">Overview</button><button data-view="missions">Missions</button><button data-view="tasks">Tasks</button><button data-view="agents">Agents</button><button data-view="hierarchy">Agent Hierarchy</button><button data-view="schedules">Scheduler</button><button data-view="activity">Activity</button><button data-view="actions">Computer Activity</button><button data-view="approvals">Approvals</button><button data-view="recovery">Recovery</button><button data-view="resources">Resources</button><button data-view="world">World Model</button><button data-view="memory">Memory</button><button data-view="skills">Skills</button><button data-view="security">Security</button><button data-view="inventory">Inventory</button><button data-view="analytics">Analytics</button><button data-view="health">System Health</button></nav>
<main><section class="toolbar"><label>Global search <input id="search" type="search" placeholder="Mission, agent, error…"></label><button id="newMission">Create mission</button><button id="refresh">Refresh</button><button id="takeover" class="danger">Take control</button></section><div id="content" aria-live="polite"></div></main></div>
<dialog id="auth"><form method="dialog"><h2>Connect to runtime</h2><p>Enter the dashboard access token. It is kept in this browser tab only.</p><input id="token" type="password" autocomplete="off" required><button id="connect">Connect</button></form></dialog>
<dialog id="missionDialog"><form method="dialog"><h2>Create mission</h2><label>Objective<input id="missionGoal" maxlength="4000" required></label><label>Priority<input id="missionPriority" type="number" min="-100" max="100" value="0"></label><button id="submitMission">Request mission</button></form></dialog>
<script src="/static/app.js"></script></body></html>
